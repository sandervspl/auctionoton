name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm install --frozen-lockfile
      - name: Check every workspace
        run: pnpm check
      - name: Test extension realm selection
        run: pnpm --filter @auctionoton/extension test
      - name: Test extension development API routing
        run: pnpm --filter @auctionoton/extension test:dev
      - name: Test Cloudflare bindings and workflows
        run: pnpm test:cloudflare
      - name: Test Access authentication
        run: pnpm --filter @auctionoton/website test:auth
      - name: Build every app
        run: pnpm build
        env:
          APP_ENV: development
          TEST_SITE_URL: http://localhost:3001
      - name: Smoke test the production website
        run: pnpm exec turbo run test:smoke --filter=@auctionoton/website
        env:
          APP_ENV: development
          TEST_SITE_URL: http://localhost:3001
      - name: Build Firefox extension
        run: pnpm build:firefox
