name: Deploy to Chrome Web Store

on:
  push:
    tags: ['extension-v*']

permissions:
  contents: read

concurrency:
  group: deploy-chrome
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the extension version
        run: |
          version=$(node -p "require('./apps/extension/package.json').version")
          if [ "$GITHUB_REF_NAME" != "extension-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match extension version $version"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check and package extension
        run: pnpm exec turbo run typecheck zip --filter=@auctionoton/extension
      - name: Keep the packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: auctionoton-chrome
          path: apps/extension/.output/auctionoton-chrome.zip
          if-no-files-found: error
      - name: Deploy to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v4.0.1
        with:
          file-path: apps/extension/.output/auctionoton-chrome.zip
          extension-id: ${{ secrets.CHROME_WEBSTORE_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
