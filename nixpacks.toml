providers = ['node']

[variables]
NIXPACKS_NODE_VERSION = '22'
NODE_ENV = 'production'
NPM_CONFIG_PRODUCTION = 'false'

[phases.install]
dependsOn = ['setup']
cmds = ['npm install --global pnpm@10.7.1 bun@1.3.14', 'pnpm install --frozen-lockfile']
cacheDirectories = ['/root/.local/share/pnpm/store']

[phases.build]
dependsOn = ['install']
cmds = ['pnpm exec turbo run build --filter=@auctionoton/server']
cacheDirectories = ['.turbo']

[start]
cmd = 'pnpm --filter @auctionoton/server start'
